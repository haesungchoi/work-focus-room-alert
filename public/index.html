<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포커스룸 자리 배정</title>
  <meta property="og:title" content="포커스룸 자리 배정">
  <meta property="og:description" content="팀 자율좌석 배정 앱 · 포커스룸 / 외부 좌석 자동 배정">
  <!-- TODO: Firebase Hosting 배포 후 실제 도메인으로 교체 (예: https://your-project.web.app/domain.jpg) -->
  <meta property="og:image" content="/domain.jpg">
  <meta property="og:type" content="website">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3E6AE1">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="포커스룸">
  <!-- SPA 캐치올 리라이트 때문에 이 두 origin에 대한 명시적 preconnect가 없으면 첫 로드 때
       Firebase SDK/Firestore 커넥션이 DNS+TLS 핸드셰이크를 나중에야 시작하게 된다. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <style>
    /* Tesla DESIGN.md 참고: 단일 액센트(Electric Blue) + 그림자/그라디언트/장식 없음 +
       카드 구분은 테두리 대신 면(surface-alt) 톤 차이로, 4px 버튼/12px 카드의 절제된 radius 스케일.
       단, 5명을 구분하는 아바타/점 색상만은 다인원 도구의 기능적 필요로 예외를 둔다. */
    :root {
      --accent: #3E6AE1; --accent-bg: #EDF2FD;
      --surface: #FFFFFF; --surface-alt: #F4F4F4;
      --line: #EEEEEE; --line-soft: #D0D1D2;
      --text: #171A20; --text-body: #393C41; --muted: #5C5E62; --placeholder: #8E8E8E;
      --danger: #B3261E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: var(--surface); color: var(--text-body); min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header {
      background: var(--surface); border-bottom: 1px solid var(--line);
      padding: 13px 18px; position: sticky; top: 0; z-index: 20;
    }
    .header h1 { font-size: 16px; font-weight: 500; color: var(--text); }
    .header .hdate { font-size: 11px; color: var(--muted); margin-top: 1px; }

    /* ── Nav (5 tabs) ── */
    .nav {
      display: flex; gap: 2px; background: var(--surface); border-bottom: 1px solid var(--line);
      position: sticky; top: 50px; z-index: 19; padding: 4px 6px;
    }
    .nav-tab {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 7px 2px 6px; cursor: pointer; border: none; background: none;
      border-radius: 4px; font-family: inherit; color: var(--muted);
      transition: color 0.33s, background-color 0.33s;
    }
    .nav-tab .ti { font-size: 15px; line-height: 1; }
    .nav-tab .tl { font-size: 9px; font-weight: 500; margin-top: 2px; }
    .nav-tab.active { color: var(--accent); background: var(--accent-bg); }

    /* ── Layout ── */
    .content { padding: 0 15px 36px; max-width: 480px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .sec { font-size: 11px; font-weight: 500; color: var(--muted); margin: 18px 0 8px; }
    .gap8 { height: 8px; } .gap16 { height: 16px; } .gap24 { height: 24px; }
    .divider { height: 1px; background: var(--line); margin: 20px 0; }

    /* ── Seat cards ── */
    .seat-card {
      background: var(--surface-alt); border-radius: 12px;
      padding: 13px 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
    }
    .seat-card.focus { background: var(--accent-bg); }
    .seat-card.absent { opacity: 0.55; }
    .seat-icon {
      width: 36px; height: 36px; border-radius: 9px; background: rgba(23,26,32,0.06);
      display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
    }
    .seat-card.focus .seat-icon { background: rgba(62,106,225,0.14); }
    .seat-lbl { font-size: 10px; font-weight: 500; color: var(--muted); margin-bottom: 2px; }
    .seat-card.focus .seat-lbl { color: var(--accent); }
    .person-name { font-size: 15px; font-weight: 500; color: var(--text); }
    .focus-badge {
      display: inline-block; font-size: 10px; font-weight: 500;
      background: rgba(62,106,225,0.14); color: var(--accent); padding: 1px 7px; border-radius: 4px; margin-top: 3px;
    }

    /* ── Buttons ── */
    .btn {
      display: block; width: 100%; padding: 13px; border-radius: 4px; border: none;
      font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;
      transition: background-color 0.33s, color 0.33s, border-color 0.33s;
    }
    .btn + .btn { margin-top: 8px; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:active { background: #3559BE; }
    .btn-secondary { background: var(--surface); color: var(--text-body); border: 1px solid var(--line-soft); }
    .btn-danger { background: var(--surface); color: var(--danger); border: 1px solid var(--line-soft); }

    /* ── Person rows ── */
    .person-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: var(--surface-alt); border-radius: 12px; margin-bottom: 7px;
    }
    .person-row .pname { font-size: 14px; font-weight: 500; color: var(--text); }
    .person-row .psub { font-size: 11px; color: var(--muted); }
    .toggle { position: relative; width: 42px; height: 23px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top:0;left:0;right:0;bottom:0; background:var(--line-soft); border-radius:23px; transition:.33s; }
    .slider:before { content:''; position:absolute; width:17px;height:17px;left:3px;bottom:3px; background:white;border-radius:50%;transition:.33s; }
    .toggle input:checked + .slider { background: var(--text); }
    .toggle input:checked + .slider:before { transform: translateX(19px); }

    /* ── Alert ── */
    .alert { padding: 11px 13px; border-radius: 12px; font-size: 12px; margin-bottom: 4px; line-height: 1.6; background: var(--surface-alt); color: var(--text-body); }
    .alert-info { background: var(--accent-bg); color: #1F3E91; }
    .alert-warn { background: #FAF6EC; color: #7A5B00; }
    .alert-ok   { background: #EFF5EF; color: #2F5D33; }

    /* ── Focus stats (분기별 포커스룸 사용 횟수) ── */
    .focus-stat-quarter { background:var(--surface-alt); border-radius:12px; padding:14px 15px; margin-bottom:9px; }
    .focus-stat-qtitle { font-size:13px; font-weight:500; margin-bottom:10px; display:flex; align-items:center; gap:8px; color:var(--text); }
    .focus-stat-balance { font-size:10px; font-weight:500; padding:2px 7px; border-radius:4px; }
    .focus-stat-balance.ok { background:rgba(47,93,51,0.12); color:#2F5D33; }
    .focus-stat-balance.warn { background:rgba(122,91,0,0.12); color:#7A5B00; }
    .focus-stat-row { display:flex; align-items:center; gap:8px; padding:4px 0; }
    .focus-stat-name { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500; width:64px; flex-shrink:0; color:var(--text-body); }
    .focus-stat-bar-wrap { flex:1; height:8px; border-radius:4px; background:var(--surface); overflow:hidden; }
    .focus-stat-bar { height:100%; border-radius:4px; min-width:3px; }
    .focus-stat-count { font-size:11px; font-weight:500; color:var(--muted); width:32px; text-align:right; flex-shrink:0; }

    /* ── History ── */
    .history-card { background:var(--surface-alt); border-radius:12px; padding:14px 15px; margin-bottom:9px; }
    .history-date { font-size:11px; font-weight:500; color:var(--muted); margin-bottom:8px; }
    .history-row { display:flex; align-items:center; gap:8px; padding:3px 0; font-size:13px; color:var(--text-body); }
    .chip { font-size:10px; font-weight:500; padding:2px 8px; border-radius:4px; white-space:nowrap; }
    .chip.focus { background:var(--accent-bg); color:var(--accent); }
    .chip.external { background:rgba(23,26,32,0.06); color:var(--text-body); }
    .chip.absent { background:rgba(23,26,32,0.06); color:var(--muted); }

    /* ── Settings inputs ── */
    .input-group { margin-bottom: 8px; }
    .input-lbl { font-size:11px; font-weight:500; color:var(--muted); display:flex; align-items:center; gap:6px; margin-bottom:4px; }
    .pcolor-dot { width:9px;height:9px;border-radius:50%;display:inline-block; flex-shrink:0; }
    .input-field {
      width:100%; padding:11px 13px; border-radius:4px; border:1px solid var(--line-soft);
      font-size:14px; font-family:inherit; outline:none; transition:border-color .33s; background:var(--surface); color:var(--text-body);
    }
    .input-field::placeholder { color: var(--placeholder); }
    .input-field:focus { border-color: var(--accent); }
    .notif-card { background:var(--surface-alt); border-radius:12px; padding:14px 15px; margin-bottom:9px; }

    /* ── Onboarding overlay ── */
    .overlay {
      position:fixed; inset:0; background:rgba(23,26,32,0.55); z-index:100;
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .overlay.hidden { display:none; }
    .modal {
      background:var(--surface); border-radius:12px; padding:24px 20px; width:100%; max-width:400px;
    }
    .modal h2 { font-size:18px; font-weight:500; margin-bottom:4px; color:var(--text); }
    .modal .modal-sub { font-size:13px; color:var(--muted); margin-bottom:20px; }

    /* ── Calendar ── */
    .cal-person-select {
      width:100%; padding:10px 12px; border-radius:4px; border:1px solid var(--line-soft);
      font-size:13px; font-family:inherit; margin-top:12px; margin-bottom:6px; background:var(--surface); font-weight:500; color:var(--text-body);
    }
    .cal-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 0 8px;
    }
    .cal-title { font-size:16px; font-weight:500; color:var(--text); }
    .cal-nav-btn {
      width:32px; height:32px; border-radius:4px; border:1px solid var(--line-soft);
      background:var(--surface); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;
      color:var(--text-body); transition:background-color .33s;
    }
    .cal-weekdays {
      display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:2px;
    }
    .cal-wd { text-align:center; font-size:10px; font-weight:500; color:var(--muted); padding:4px 0; }
    .cal-wd:first-child { color:#B3261E; }
    .cal-wd:last-child { color:var(--accent); }
    .cal-grid { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:2px; touch-action:none; user-select:none; }
    .cal-cell {
      aspect-ratio: 1; border-radius:9px; padding:4px 3px;
      display:flex; flex-direction:column; align-items:center;
      cursor:pointer; transition:background-color .33s; position:relative; background:var(--surface);
      border: 1.5px solid transparent;
      min-width: 0; overflow: hidden;
    }
    .cal-cell:hover { background:var(--surface-alt); }
    .cal-cell.empty { background:transparent; cursor:default; }
    .cal-cell.past { opacity: 0.45; }
    .cal-cell.today { background:var(--accent-bg); }
    .cal-cell.sun .cal-num { color:#B3261E; }
    .cal-cell.sat .cal-num { color:var(--accent); }
    .cal-cell.selected { background:var(--accent-bg); }
    .cal-cell.pfocus { background:var(--accent-bg); }
    .cal-cell.pext { background:var(--surface-alt); }
    .cal-cell.pabsent { background:var(--surface-alt); opacity: 0.7; }
    .cal-cell.offday { background:var(--surface-alt); color:var(--muted); }
    .cal-cell.offday .cal-num { color:var(--muted); }
    .cal-cell.holiday { background:var(--surface-alt); }
    .cal-cell.range-selected { background:var(--accent-bg); border-color:var(--accent); }
    .cal-num { font-size:12px; font-weight:500; line-height:1; margin-bottom:2px; color:var(--text-body); }
    .cal-assigned-dot { width:4px;height:4px;border-radius:50%;background:var(--accent);margin-bottom:1px; }
    .cal-dots { display:flex; flex-wrap:wrap; gap:2px; justify-content:center; align-items:center; max-width:100%; }
    .cal-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }

    /* ── Day detail panel ── */
    .day-panel {
      background:var(--surface-alt); border-radius:12px;
      padding:16px 15px; margin-top:10px;
    }
    .day-panel-title { font-size:15px; font-weight:500; margin-bottom:12px; color:var(--text); }
    .extra-seats-row {
      display:flex; align-items:center; justify-content:center; gap:14px;
      padding:8px 0 16px;
    }
    .extra-seats-count { font-size:13px; font-weight:500; min-width:110px; text-align:center; color:var(--text-body); }
    .day-panel-person {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 12px; border-radius:8px;
      margin-bottom:6px; background:var(--surface);
    }
    .day-panel-person .pp { display:flex; align-items:center; gap:8px; }
    .person-avatar {
      width:26px; height:26px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:500; color:white; flex-shrink:0;
    }
    .day-assign-row { display:flex; align-items:center; gap:6px; padding:3px 0; font-size:13px; color:var(--text-body); }
    .day-assign-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:500; }
    .day-assign-badge.focus { background:var(--accent-bg); color:var(--accent); }
    .day-assign-badge.external { background:rgba(23,26,32,0.06); color:var(--text-body); }
    .day-assign-badge.absent { background:rgba(23,26,32,0.06); color:var(--muted); }

    /* ── Empty ── */
    .empty { text-align:center; padding:48px 20px; color:var(--muted); }
    .empty .ico { font-size:36px; margin-bottom:10px; }
    .empty p { font-size:13px; }
  </style>
</head>
<body>

<!-- ── Onboarding overlay ── -->
<div class="overlay hidden" id="onboarding">
  <div class="modal">
    <h2>👋 처음 오셨군요!</h2>
    <p class="modal-sub">팀원 5명의 이름을 입력해주세요. (한 명이 입력하면 모두에게 공유됩니다)</p>
    <div id="onboardingFields"></div>
    <div class="gap16"></div>
    <button class="btn btn-primary" onclick="finishOnboarding()">시작하기</button>
  </div>
</div>

<!-- ── Header ── -->
<div class="header">
  <h1>🪑 포커스룸 자리 배정</h1>
  <div class="hdate" id="headerDate"></div>
</div>

<!-- ── Nav ── -->
<div class="nav">
  <button class="nav-tab" data-tab="today" onclick="switchTab('today',this)">
    <span class="ti">☀️</span><span class="tl">오늘</span>
  </button>
  <button class="nav-tab" data-tab="tomorrow" onclick="switchTab('tomorrow',this)">
    <span class="ti">🔮</span><span class="tl">내일</span>
  </button>
  <button class="nav-tab" data-tab="calendar" onclick="switchTab('calendar',this)">
    <span class="ti">📅</span><span class="tl">캘린더</span>
  </button>
  <button class="nav-tab" data-tab="extraseats" onclick="switchTab('extraseats',this)">
    <span class="ti">➕</span><span class="tl">추가석</span>
  </button>
  <button class="nav-tab" data-tab="history" onclick="switchTab('history',this)">
    <span class="ti">📋</span><span class="tl">기록</span>
  </button>
  <button class="nav-tab" data-tab="settings" onclick="switchTab('settings',this)">
    <span class="ti">⚙️</span><span class="tl">설정</span>
  </button>
</div>

<!-- ── Content ── -->
<div class="content">
  <div class="tab-content" id="tab-today"></div>
  <div class="tab-content" id="tab-tomorrow"></div>
  <div class="tab-content active" id="tab-calendar"></div>
  <div class="tab-content" id="tab-extraseats"></div>
  <div class="tab-content" id="tab-history"></div>
  <div class="tab-content" id="tab-settings"></div>
</div>

<script src="/js/firebase-config.js"></script>
<script src="/js/assign.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
